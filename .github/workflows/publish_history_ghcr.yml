# Compila la imagen con el arreglo del history sync y la publica con SU PROPIA etiqueta.
#
# A proposito NO reusa :fix-ws, que es la etiqueta que corre en produccion: evogo es un solo
# contenedor y sirve a todos los canales, asi que sobrescribirla dejaria a Ventas corriendo
# codigo sin probar en el proximo reinicio, y sin imagen vieja a la que volver.
#
# Se despliega cambiando el tag en Portainer a :fix-history. Si algo sale mal, se vuelve a
# :fix-ws y listo.
name: Build history-sync image (ghcr)

on:
  push:
    branches:
      - fix/history-sync-image
  workflow_dispatch: {}

jobs:
  build_push:
    name: Build and push to ghcr.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION 2>/dev/null || echo '0.0.0')" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/alexmorer/evolution-go:fix-history
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
